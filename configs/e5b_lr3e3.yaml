# E5b — CNN-B + aug, lr = 3e-3, chỉ 10 epoch để so sánh XU HƯỚNG.
experiment:
  id: e5b_lr3e3
  seed: 42
  notes: "CNN-B + aug, lr 3e-3, 10 epoch (so sánh xu hướng lr, không hội tụ hoàn toàn)"

model:
  name: cnn_b
  widths: [32, 64, 128]
  use_bn: true
  dropout: 0.3
  gap: false
  fc_hidden: 256

augmentation:
  enabled: true

train:
  lr: 0.003
  weight_decay: 0.0001
  max_epochs: 10
  patience: 10
