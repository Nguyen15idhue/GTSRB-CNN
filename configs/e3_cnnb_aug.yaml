# E3 — CNN-B + augmentation nhẹ (ứng viên mô hình chính).
# So với E2 chỉ đổi một nhóm yếu tố: bật augmentation.
experiment:
  id: e3_cnnb_aug
  seed: 42
  notes: "CNN-B + BN + dropout 0.3 + WD 1e-4 + augmentation nhẹ (so với E2: bật aug)"

model:
  name: cnn_b
  widths: [32, 64, 128]
  use_bn: true
  dropout: 0.3
  gap: false
  fc_hidden: 256

augmentation:
  enabled: true

train:
  weight_decay: 0.0001
