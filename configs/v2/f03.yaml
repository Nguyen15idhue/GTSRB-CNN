experiment:
  id: f03
  protocol: v2_clean
  block: F_factorial
  seed: 42
  notes: 'Factorial 2^4: BN=on, DO=0.3, WD=0, Aug=off'
data:
  split: screening
  fold: null
  image_size: 64
  num_classes: 43
  num_workers: 4
model:
  name: smallcnn_3blk
  widths:
  - 32
  - 64
  - 128
  use_bn: true
  dropout: 0.3
  gap: false
  fc_hidden: 256
augmentation:
  enabled: false
  profile: none
train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0
  batch_size: 128
  max_epochs: 40
  patience: 7
  scheduler: cosine
  warmup_epochs: 0
  class_weight: none
  label_smoothing: 0.0
  amp: true
  monitor: val_macro_f1
  deterministic: true
output:
  dir: outputs/runs
