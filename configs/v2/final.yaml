experiment:
  id: final
  protocol: v2_clean
  block: D_architecture
  seed: 42
  notes: final từ d2 (winner OOF x2); epoch cố định 26 (median 9 run OOF); OOF cao
    nhat 97.040; x1 vs x2 CI chua 0; tie-break it params hon (1.45M vs 2.20M)
data:
  split: dev_all
  fold: null
  image_size: 64
  num_classes: 43
  num_workers: 4
model:
  name: smallcnn_4blk
  widths:
  - 32
  - 64
  - 128
  - 256
  use_bn: true
  dropout: 0.3
  gap: false
  fc_hidden: 256
augmentation:
  enabled: true
  profile: all
train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 26
  patience: 27
  scheduler: cosine
  warmup_epochs: 0
  class_weight: none
  label_smoothing: 0.0
  amp: true
  monitor: val_macro_f1
  deterministic: true
output:
  dir: outputs/runs
