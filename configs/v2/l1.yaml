experiment:
  id: l1
  protocol: v2_clean
  block: H_hyperparam
  seed: 42
  notes: LR 1e-4; 40 epoch; cách 10 lần so với 1e-3
data:
  split: screening
  fold: null
  image_size: 64
  num_classes: 43
  num_workers: 4
model:
  name: smallcnn_3blk
  widths:
  - 32
  - 64
  - 128
  use_bn: true
  dropout: 0.3
  gap: false
  fc_hidden: 256
augmentation:
  enabled: true
  profile: all
train:
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 40
  patience: 7
  scheduler: cosine
  warmup_epochs: 0
  class_weight: none
  label_smoothing: 0.0
  amp: true
  monitor: val_macro_f1
  deterministic: true
output:
  dir: outputs/runs
