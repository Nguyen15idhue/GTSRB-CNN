experiment:
  id: x3
  protocol: v2_clean
  block: X_confirmation
  seed: 42
  notes: 'OOF cho f07: f1=0.965007 (sd 0.010409), params=2201931, latency=0.7407 ms,
    aug=none, best_epoch=20.7'
  source_config: f07
data:
  split: fold
  fold: 0
  image_size: 64
  num_classes: 43
  num_workers: 4
model:
  name: smallcnn_3blk
  widths:
  - 32
  - 64
  - 128
  use_bn: true
  dropout: 0.3
  gap: false
  fc_hidden: 256
augmentation:
  enabled: false
  profile: none
train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 40
  patience: 7
  scheduler: cosine
  warmup_epochs: 0
  class_weight: none
  label_smoothing: 0.0
  amp: true
  monitor: val_macro_f1
  deterministic: true
output:
  dir: outputs/runs
