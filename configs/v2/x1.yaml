experiment:
  id: x1
  protocol: v2_clean
  block: X_confirmation
  seed: 42
  notes: 'OOF cho g2: f1=0.974173 (sd 0.003402), params=2201931, latency=0.7280 ms,
    aug=color, best_epoch=21.3'
  source_config: g2
data:
  split: fold
  fold: 0
  image_size: 64
  num_classes: 43
  num_workers: 4
model:
  name: smallcnn_3blk
  widths:
  - 32
  - 64
  - 128
  use_bn: true
  dropout: 0.3
  gap: false
  fc_hidden: 256
augmentation:
  enabled: true
  profile: color
train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 40
  patience: 7
  scheduler: cosine
  warmup_epochs: 0
  class_weight: none
  label_smoothing: 0.0
  amp: true
  monitor: val_macro_f1
  deterministic: true
output:
  dir: outputs/runs
